$kind: http-request
url: "{{base_url}}/courses?q=web"
method: GET
queryParams:
  q: web
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code la 200', () => pm.response.to.have.status(200));
      pm.test('Tim thay INT2204', () => pm.expect(pm.response.json().map(course => course.code)).to.eql(['INT2204']));
    language: text/javascript
order: 3000
