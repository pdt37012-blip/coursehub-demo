$kind: http-request
url: "{{base_url}}/health"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code la 200', () => {
        pm.response.to.have.status(200);
      });
      pm.test('Response la JSON', () => {
        pm.response.to.be.json;
      });
    language: text/javascript
order: 1000
